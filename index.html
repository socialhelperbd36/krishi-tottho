<head>

<title>কৃষি তথ্য – বাংলাদেশের কৃষকের সহজ গাইড</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f3;--surface:#ffffff;--ink:#14301e;--muted:#4f6657;--line:#d3dfd0;--green:#1f6b3a;--gold:#e0a800;--soil:#6b4430;--on-green:#ffffff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--surface:#17261c;--ink:#e6f0e8;--muted:#9db3a3;--line:#2a3f31;--green:#4cb072;--gold:#f0c23a;--soil:#d0a58b;--on-green:#0f1a13}}
:root[data-theme="dark"]{--bg:#0f1a13;--surface:#17261c;--ink:#e6f0e8;--muted:#9db3a3;--line:#2a3f31;--green:#4cb072;--gold:#f0c23a;--soil:#d0a58b;--on-green:#0f1a13}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.7;font-size:17px}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;line-height:1.25;margin:8px 0 4px;color:var(--green)}
.sub{color:var(--muted);margin:0 0 18px}
.now{background:var(--green);color:var(--on-green);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.now b{font-size:1.25rem;color:inherit}
.now span{display:block;opacity:.92}
.months{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px}
.months i{flex:0 0 auto;font-style:normal;font-size:.85rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.months i.cur{background:var(--gold);color:#2a2000;border-color:var(--gold);font-weight:700}
input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.chips button{font:inherit;font-size:.95rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
details{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;margin-bottom:10px}
details[data-c="রোগ-পোকা"]{border-left-color:var(--soil)}
details[data-c="সাহায্য"]{border-left-color:var(--gold)}
summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.body{padding:0 14px 14px}
.body ul{margin:6px 0 0;padding-left:20px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.calc label{display:block;margin-top:10px;font-weight:500}
.calc input,.sch input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.res{margin:16px 0;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.res p{margin:4px 0}.res .big{font-size:1.3rem;font-weight:700}
.pos{color:var(--green)}.neg{color:#c0392b}
.res a{color:var(--green);font-weight:700}
.res small{display:block;color:var(--muted);margin-bottom:10px}
.note{margin-top:24px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.92rem}
</style>
</head>

<h1>কৃষি তথ্য</h1>
<p class="sub">বাংলাদেশের কৃষকের জন্য সহজ বাংলা গাইড: কখন কী চাষ, রোগ-পোকা, সার, সেচ ও সংরক্ষণ।</p>
<div class="now" id="now"></div>
<div class="months" id="months" aria-label="বাংলা মাস"></div>
<input type="search" id="q" placeholder="খুঁজুন: ধান, আলু, সার, পোকা…" aria-label="খুঁজুন">
<div class="chips" id="modes"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<p class="note">এটি সাধারণ তথ্য। এলাকা, মাটি ও আবহাওয়াভেদে সময় ও পরিমাণ আলাদা হতে পারে। কীটনাশক বা সারের মাত্রা ঠিক করার আগে স্থানীয় উপসহকারী কৃষি অফিসারের সঙ্গে কথা বলুন।</p>
</main>

"ফল বা সবজিতে ছত্রাকের দাগ ও পচন|p|ছত্রাক রোগ|আক্রান্ত অংশ সরিয়ে ফেলুন, গাছের গোড়ায় আলো-বাতাস রাখুন। প্রয়োজনে অনুমোদিত ছত্রাকনাশক কৃষি অফিসারের পরামর্শে দিন।",
"বন্যা বা জলাবদ্ধতায় ফসল ডুবে গেছে|n|অতিরিক্ত পানি|দ্রুত পানি নিষ্কাশন করুন। পানি নামলে স্বল্পমেয়াদি সবজি বা শাক লাগান। ধানের জন্য ব্রি ধান৫২-এর মতো ডুবে থাকা সহনশীল জাত বিবেচনা করুন।"
];
function card(t,cat,tag,lines){return '<details data-c="'+cat+'"><summary>'+t+'<small>'+tag+'</small></summary><div class="body"><ul>'+lines.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div></details>'}
function renderCrops(){var r=C.filter(function(x){return !qs||x.toLowerCase().indexOf(qs)>-1});document.getElementById('list').innerHTML=r.length?r.map(function(x){var a=x.split('|');return card(a[0],'ফসল',a[1],['<b>বপন বা রোপণ:</b> '+a[2],'<b>ফসল তোলা:</b> '+a[3],'<b>ভালো হয় যেসব এলাকায়:</b> '+a[4],'<b>উপযুক্ত মাটি:</b> '+a[5]])}).join(''):'<div class="empty">কিছু পাওয়া যায়নি।</div>'}
function renderProb(){var r=P.filter(function(x){return !qs||x.toLowerCase().indexOf(qs)>-1});document.getElementById('list').innerHTML=r.length?r.map(function(x){var a=x.split('|');return card(a[0],a[1]=='p'?'রোগ-পোকা':'মাটি-সার',a[2],[a[3]])}).join('')+'<p class="note">কীটনাশক বা ছত্রাকনাশকের নাম ও মাত্রা এখানে ইচ্ছা করেই দেওয়া হয়নি। ভুল মাত্রা মানুষ, মাছ ও মৌমাছির ক্ষতি করে এবং পোকা প্রতিরোধী হয়ে যায়। সমস্যার ছবি তুলে উপজেলা কৃষি অফিস বা কৃষি কল সেন্টারে (১৬১২৩) দেখান।</p>':'<div class="empty">কিছু পাওয়া যায়নি।</div>'}
var CF=[['land','জমির পরিমাণ (শতক)'],['seed','বীজ খরচ (টাকা)'],['fert','সার খরচ (টাকা)'],['pest','কীটনাশক ও ওষুধ খরচ (টাকা)'],['labor','শ্রমিক খরচ (টাকা)'],['irr','সেচ খরচ (টাকা)'],['other','অন্যান্য খরচ: জমি তৈরি, পরিবহন ইত্যাদি (টাকা)'],['yield','মোট উৎপাদন (কেজি)'],['price','বিক্রয়মূল্য (টাকা প্রতি কেজি)']];
function bn(n){return Number(n).toLocaleString('bn-BD',{maximumFractionDigits:0})}
function renderCalc(){document.getElementById('list').innerHTML='<div class="calc"><b>খরচ ও লাভের হিসাব</b>'+CF.map(function(f){return '<label for="c_'+f[0]+'">'+f[1]+'</label><input type="number" inputmode="decimal" min="0" id="c_'+f[0]+'">'}).join('')+'</div><div class="res" id="cres">উপরের ঘরগুলো পূরণ করুন।</div><div class="sch"><b>ধান রোপণের পর কাজের তারিখ</b><label for="sd">রোপণের তারিখ</label><input type="date" id="sd"><div class="res" id="sres">তারিখ দিলে সাধারণ সময়সূচি দেখাবে।</div></div>'}
function calc(){function v(k){return parseFloat(document.getElementById('c_'+k).value)||0}var cost=v('seed')+v('fert')+v('pest')+v('labor')+v('irr')+v('other'),inc=v('yield')*v('price'),pf=inc-cost,l=v('land'),h='<p>মোট খরচ: <b>'+bn(cost)+' টাকা</b></p>';if(l>0)h+='<p>প্রতি শতকে খরচ: '+bn(cost/l)+' টাকা</p><p>প্রতি বিঘায় খরচ: '+bn(cost/l*33)+' টাকা</p>';h+='<p>মোট আয়: <b>'+bn(inc)+' টাকা</b></p><p class="big '+(pf>=0?'pos':'neg')+'">'+(pf>=0?'নিট লাভ: ':'লোকসান: ')+bn(Math.abs(pf))+' টাকা</p><small>১ বিঘা = ৩৩ শতক ধরা হয়েছে; এলাকাভেদে ভিন্ন হতে পারে।</small>';document.getElementById('cres').innerHTML=h}
function sched(){var d=document.getElementById('sd').value;if(!d)return;var s=[[7,'চারার বৃদ্ধি দেখুন'],[15,'আগাছা ও পুষ্টির অবস্থা পরীক্ষা করুন'],[25,'প্রয়োজনে সার ব্যবস্থাপনা (কৃষি অফিসের সুপারিশ অনুযায়ী)']];document.getElementById('sres').innerHTML=s.map(function(x){var t=new Date(d);t.setDate(t.getDate()+x[0]);return '<p><b>'+bn(x[0])+' দিন পর ('+t.toLocaleDateString('bn-BD')+'):</b> '+x[1]+'</p>'}).join('')+'<p>এরপর রোগ-পোকা ও পানির অবস্থা নিয়মিত দেখুন।</p><small>এটি সাধারণ নিয়ম। জাতভেদে সময় আলাদা, তাই জাতের নির্দেশনা দেখে নিন।</small>'}
document.addEventListener('input',function(e){if(e.target.id&&e.target.id.indexOf('c_')==0)calc();if(e.target.id=='sd')sched()});
var SRC=[['কৃষি সম্প্রসারণ অধিদপ্তর (DAE)','https://dae.gov.bd','ফসল উৎপাদন প্রযুক্তি, সার ও বালাইনাশক নির্দেশিকা'],['ফসল জোনিং (BARC)','https://cropzoning.gov.bd','এলাকা ও জমি অনুযায়ী ফসল নির্বাচন'],['সার সুপারিশ গাইড (BARC)','https://apps.barc.gov.bd/fertilizer_recommendation/FRG%20English%2030.10.2024.pdf','ফসল ও মাটিভেদে সারের সুপারিশ (ইংরেজি PDF)'],['কৃষি আবহাওয়া (BAMIS)','https://www.bamis.gov.bd','আবহাওয়া, কৃষি ক্যালেন্ডার, বন্যা ও খরার তথ্য'],['দৈনিক বাজারদর (কৃষি বিপণন অধিদপ্তর)','https://market.dam.gov.bd','কৃষিপণ্যের দৈনিক পাইকারি ও খুচরা দাম'],['মাটি পরীক্ষা (SRDI)','https://srdi.gov.bd','মাটির উর্বরতা, pH ও মানচিত্র'],['ধান গবেষণা ইনস্টিটিউট (BRRI)','https://brri.gov.bd','ধানের জাত, চাষ পদ্ধতি, রোগবালাই'],['কৃষি গবেষণা ইনস্টিটিউট (BARI)','https://bari.gov.bd','সবজি, ফল, ডাল, তেল ও মসলার জাত'],['কৃষি তথ্য সার্ভিস (AIS)','https://ais.gov.bd','কৃষি ভিডিও, নিবন্ধ ও পরামর্শ']];
function renderSrc(){document.getElementById('list').innerHTML='<div class="res"><small>সরকারি কৃষি প্রতিষ্ঠানের নির্ভরযোগ্য তথ্যের জন্য নিচের সাইটগুলো দেখুন। বাজারদর ও আবহাওয়ার মতো দ্রুত বদলানো তথ্য এখানে নয়, ওই সাইটেই দেখা ভালো।</small>'+SRC.map(function(s){return '<p><a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a><br>'+s[2]+'</p>'}).join('')+'<p>কৃষি কল সেন্টার: <b>১৬১২৩</b></p></div>'}
function render(){document.getElementById('chips').style.display=mode=='g'?'flex':'none';document.getElementById('q').style.display=(mode=='k'||mode=='s')?'none':'block';if(mode=='c')renderCrops();else if(mode=='p')renderProb();else if(mode=='k')renderCalc();else if(mode=='s')renderSrc();else renderGuide()}
function modes(){document.getElementById('modes').innerHTML=[['g','মাস অনুযায়ী গাইড'],['c','সব ফসল'],['p','সমস্যা ও সমাধান']].concat([['k','খরচ ও লাভ'],['s','সরকারি উৎস']]).map(function(f){return '<button aria-pressed="'+(mode==f[0])+'" data-m="'+f[0]+'">'+f[1]+'</button>'}).join('')}
document.getElementById('modes').addEventListener('click',function(e){var m=e.target.getAttribute('data-m');if(m){mode=m;modes();render()}});
modes();
document.getElementById("chips").addEventListener("click",function(e){var f=e.target.getAttribute("data-f");if(f){flt=f;chips();render()}});
document.getElementById("q").addEventListener("input",function(e){qs=e.target.value.trim().toLowerCase();if(qs&&flt=="now"){flt="all";chips()}render()});
chips();render();
</script>
</body>
